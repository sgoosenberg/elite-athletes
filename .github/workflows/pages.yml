name: Publish application form
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and build form
        run: |
          python3 -B -m unittest -v
          python3 -B build_pages.py
          mkdir -p "$RUNNER_TEMP/public-form"
          cp docs/index.html docs/app.js docs/config.js "$RUNNER_TEMP/public-form/"
          cp docs/admin.html docs/admin.js "$RUNNER_TEMP/public-form/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public-form
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
